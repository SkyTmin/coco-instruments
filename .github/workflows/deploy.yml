name: Deploy to VPS

# Full auto-deploy: builds nothing locally — it SSHes into the VPS, runs the
# tested deploy/setup.sh (Node + Caddy + HTTPS via nip.io), then points the
# Telegram bot's menu button at the app.
#
# Runs on GitHub's servers (which CAN reach the VPS and api.telegram.org).
# It stays GREEN and skips until the required secrets are added:
#   Repo → Settings → Secrets and variables → Actions →
#     VPS_HOST       e.g. 31.184.198.91
#     VPS_PASSWORD   the server root password
#     BOT_TOKEN      the @coco_instruments_bot token
#   (optional) VPS_USER (default root), DOMAIN (default <VPS_HOST>.nip.io)

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that secrets are configured
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add secrets VPS_HOST and VPS_PASSWORD (and BOT_TOKEN) to enable deployment. Skipping for now."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "domain=${DOMAIN:-${VPS_HOST}.nip.io}" >> "$GITHUB_OUTPUT"
          if [ -n "$BOT_TOKEN" ]; then echo "has_bot=true" >> "$GITHUB_OUTPUT"; else echo "has_bot=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CF_API_TOKEN" ]; then echo "has_cf=true" >> "$GITHUB_OUTPUT"; else echo "has_cf=false" >> "$GITHUB_OUTPUT"; fi

      # Russia (since 2025-06) throttles Cloudflare's proxy to ~16 KB per asset,
      # so a Cloudflare-fronted site never finishes loading there. Take the domain
      # OUT of the proxy (grey-cloud / "DNS only") so users connect STRAIGHT to the
      # VPS IP — which, for a Russian VPS, isn't throttled like Cloudflare is.
      # Caddy keeps serving a real Let's Encrypt cert, so HTTPS stays valid.
      # Best-effort + idempotent: a token/zone problem only prints a warning.
      # Режим прокси Cloudflare деплой больше НЕ меняет.
      #
      # Раньше здесь домен принудительно переводился в серый режим: считалось,
      # что люди ходят из России напрямую, а прокси Cloudflare Россия режет
      # примерно на 16 КБ. Но Telegram в России заблокирован, поэтому все
      # пользователи сидят через VPN с заграничными выходами — для них прокси
      # как раз работает, а вот до российского IP напрямую доходят не все.
      # Что выгоднее, серый режим или оранжевый, теперь решает владелец в
      # панели Cloudflare; переключить вручную можно workflow «DNS check».
      # Деплою остаётся только доложить, как дела сейчас.

      # Что на самом деле отдаётся пользователю. Оба режима допустимы, поэтому
      # это отчёт, а не приговор: оранжевый выручает тех, кто приходит через
      # заграничный VPN (а так приходят все, раз Telegram в России закрыт),
      # серый — тех, кто ходит из России напрямую.
      - name: Как домен отдаётся снаружи
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          DOMAIN: ${{ steps.gate.outputs.domain }}
        run: |
          H="$(curl -sS -D - -o /tmp/idx.html --max-time 25 "https://${DOMAIN}/" || true)"
          if printf '%s' "$H" | grep -qi '^cf-ray:'; then
            echo "режим: ОРАНЖЕВЫЙ (через прокси Cloudflare)"
            echo "  плюс:  доступен с заграничных VPN, которыми пользуются все в Telegram"
            echo "  минус: из России напрямую ответы режутся примерно на 16 КБ"
          else
            echo "режим: СЕРЫЙ (напрямую до VPS)"
            echo "  плюс:  из России напрямую всё быстро и целиком"
            echo "  минус: часть заграничных VPN до этого IP не доходит"
          fi
          N="$(wc -c < /tmp/idx.html || echo 0)"
          echo "index.html: $N байт"
          if [ "$N" -lt 4000 ]; then
            echo "::error::index.html пришёл обрезанным ($N байт) — страница не запустится."
          fi

      # The VPS can't reach caddyserver.com, so fetch the Caddy build that has the
      # Cloudflare DNS plugin here (the runner has open internet) and ship it over.
      # Both steps are best-effort: if either fails, setup.sh just keeps the
      # current Caddy and cert (DNS-01 stays off) — the deploy still succeeds.
      - name: Fetch Caddy + Cloudflare DNS plugin (for cert auto-renewal)
        id: caddycf
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.has_cf == 'true'
        continue-on-error: true
        run: |
          # Build for both arches — the VPS arch is unknown here; setup.sh picks.
          for A in amd64 arm64; do
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 240 -o "caddy-cf-$A" \
              "https://caddyserver.com/api/download?os=linux&arch=$A&p=github.com/caddy-dns/cloudflare"
          done
          chmod +x caddy-cf-amd64 caddy-cf-arm64
          ./caddy-cf-amd64 list-modules | grep -q 'dns.providers.cloudflare'
          ls -la caddy-cf-*
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Ship Caddy + plugin to the VPS
        if: steps.gate.outputs.ready == 'true' && steps.caddycf.outputs.ok == 'true'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          # Prefer a key (add secret VPS_SSH_KEY); falls back to the password if unset.
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "caddy-cf-amd64,caddy-cf-arm64"
          target: /tmp/

      - name: Deploy on VPS (install + build + HTTPS)
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          # Prefer key-based auth (set secret VPS_SSH_KEY — safer than a root
          # password). If it's empty the action falls back to the password.
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 25m
          script: |
            export DOMAIN='${{ steps.gate.outputs.domain }}'
            export BRANCH='prod'
            export BOT_TOKEN='${{ secrets.BOT_TOKEN }}'
            export GH_DISPATCH_TOKEN='${{ secrets.GH_TOKEN }}'
            export ADMIN_CHAT_ID='${{ secrets.ADMIN_CHAT_ID }}'
            export CF_API_TOKEN='${{ secrets.CF_API_TOKEN }}'
            # After the first provisioning the repo is checked out at /opt/coco.
            # Update it via git and run the CHECKED-OUT setup.sh instead of piping a
            # freshly-fetched script into bash as root (avoids curl|bash RCE/MITM).
            # Only the very first install still bootstraps over the network.
            if [ -d /opt/coco/.git ]; then
              git -C /opt/coco fetch --depth 1 origin "$BRANCH"
              git -C /opt/coco reset --hard "origin/$BRANCH"
              bash /opt/coco/deploy/setup.sh
            else
              curl -fsSL --proto '=https' --tlsv1.2 \
                "https://raw.githubusercontent.com/SkyTmin/coco-instruments/${BRANCH}/deploy/setup.sh" | bash
            fi

      - name: Verify the app is up
        if: steps.gate.outputs.ready == 'true'
        env:
          DOMAIN: ${{ steps.gate.outputs.domain }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://${DOMAIN}/api/health"

      - name: Point the Telegram bot at the app
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.has_bot == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DOMAIN: ${{ steps.gate.outputs.domain }}
        run: |
          # Trim any stray whitespace/newline so the secret below matches the
          # server's (which hashes the trimmed token). A drift here = webhook 401.
          TOK="$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')"
          echo "== getWebhookInfo (before re-register) =="
          curl -fsS "https://api.telegram.org/bot${TOK}/getWebhookInfo" || true
          echo
          curl -fsS "https://api.telegram.org/bot${TOK}/setChatMenuButton" \
            -H "Content-Type: application/json" \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Coco\",\"web_app\":{\"url\":\"https://${DOMAIN}/\"}}}"
          echo
          # Register the webhook so /start works and users become reachable.
          #
          # Сначала УДАЛЯЕМ. Telegram запоминает IP, к которому резолвился
          # домен в момент регистрации, и сам его не перечитывает: setWebhook с
          # тем же адресом отвечает «Webhook is already set» и ничего не
          # меняет. После переключения домена на прокси Cloudflare он из-за
          # этого продолжал ломиться на старый IP сервера и получать
          # «Connection timed out». deleteWebhook + setWebhook заставляют
          # перечитать DNS. drop_pending_updates не ставим — накопившиеся
          # сообщения должны дойти.
          curl -fsS "https://api.telegram.org/bot${TOK}/deleteWebhook" \
            -H "Content-Type: application/json" -d '{"drop_pending_updates":false}'
          echo
          SECRET=$(printf '%s' "$TOK" | sha256sum | cut -c1-48)
          curl -fsS "https://api.telegram.org/bot${TOK}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"https://${DOMAIN}/api/bot/webhook\",\"secret_token\":\"${SECRET}\",\"allowed_updates\":[\"message\"]}"
          echo
          echo "== getWebhookInfo (after) =="
          curl -fsS "https://api.telegram.org/bot${TOK}/getWebhookInfo" || true
          echo

      - name: Done
        if: steps.gate.outputs.ready == 'true'
        run: echo "Deployed. Open @coco_instruments_bot and tap the menu button."
