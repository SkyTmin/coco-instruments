name: Daily backup to Telegram

# The VPS often can't reach api.telegram.org to push a file out (and Telegram
# can't reach the VPS). So a GitHub runner — which can reach both — makes a fresh
# backup on the VPS, pulls it, and sends it to the admin. Recipient = the chat
# that requested a backup from the app (stored in /var/lib/coco/admin.json) or
# the ADMIN_CHAT_ID secret.
on:
  schedule:
    - cron: '30 0 * * *' # 03:30 MSK
  workflow_dispatch:

concurrency:
  group: coco-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_PASSWORD" ] || [ -z "$BOT_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backup skipped — need VPS_HOST, VPS_PASSWORD, BOT_TOKEN."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make + fetch backup, deliver to admin
        if: steps.gate.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          HOSTSPEC="${VPS_USER:-root}@${VPS_HOST}"
          # Prefer key-based auth (secret VPS_SSH_KEY); fall back to the password.
          if [ -n "${VPS_SSH_KEY:-}" ]; then
            install -m 600 /dev/null key
            printf '%s\n' "$VPS_SSH_KEY" > key
            vps() { ssh -i key -o StrictHostKeyChecking=no -o ConnectTimeout=25 "$HOSTSPEC" "$@"; }
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            vps() { sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 "$HOSTSPEC" "$@"; }
          fi

          # 1) make a fresh backup on the VPS, then read the admin id and archive out
          vps 'bash /opt/coco/deploy/backup.sh >/dev/null 2>&1 || true; cat /var/lib/coco/admin.json 2>/dev/null || true' > admin.json || true
          vps 'base64 -w0 /var/lib/coco/backups/latest.tar.gz' > latest.b64
          base64 -d latest.b64 > latest.tar.gz
          echo "Archive size: $(wc -c < latest.tar.gz) bytes"

          # 2) recipient
          ADMIN="${ADMIN_CHAT_ID:-}"
          if [ -z "$ADMIN" ] && [ -s admin.json ]; then
            ADMIN=$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('admin.json','utf8')).chatId||''))}catch(e){}")
          fi
          if [ -z "$ADMIN" ]; then
            echo "::warning::No admin yet — tap «Прислать резервную копию» in the app once (or set ADMIN_CHAT_ID)."
            exit 0
          fi

          # 3) deliver from the runner (it can reach Telegram)
          curl -fsS -F chat_id="$ADMIN" \
            -F caption="🗄 Резервная копия Coco ($(date +%F))" \
            -F document=@latest.tar.gz \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" >/dev/null
          echo "Backup delivered to $ADMIN"
